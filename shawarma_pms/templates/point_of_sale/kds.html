{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kitchen Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#1b1b1b;color:#f2f2f2}
 header{padding:.6rem 1rem;background:#000;display:flex;justify-content:space-between}
 #board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem;padding:1rem}
 .t{background:#2c2c2c;border-radius:8px;padding:.7rem;border-top:6px solid #4caf50}
 .t.late{border-top-color:#e53935}.t.preparing{background:#33301f}
 .t h3{margin:0 0 .3rem}.t ul{padding-left:1.1rem;margin:.3rem 0}.note{color:#ffcc80;font-size:.85rem}
 button{width:100%;padding:.6rem;font-size:1rem;border:0;border-radius:6px;background:#ff9800;cursor:pointer}
</style></head>
<body data-poll-ms="{{ poll_ms }}">
<header><strong>KDS</strong><span id="status">connecting…</span></header>
<main id="board"></main>
<script>window.CSRF="{{ csrf_token }}";</script>
<script src="{% static 'js/kds.js' %}"></script>
</body></html>
